name: 同步 Navicat 安装包镜像

on:
  schedule:
    - cron: '17 */6 * * *' # 每 6 小时探测一次
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror # 首次回填耗时较长，避免定时任务叠加
  cancel-in-progress: false

jobs:
  mirror:
    name: 探测并同步
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 同步安装包到 Releases
        run: python mirror.py sync

      - name: 生成 README
        if: always()
        run: python mirror.py readme

      - name: 提交 README
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || (git commit -m "docs: 更新镜像索引" && git push)
